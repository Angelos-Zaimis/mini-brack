# Local development profile. Activated by default by ./gradlew bootRun (see minibrack.spring-service).

spring:
  docker:
    compose:
      # bootRun's working directory is services/catalog-service
      file: ../../infra/compose.yaml
      # Leave the DB running when the app stops: faster restarts, usable from psql/GUI.
      lifecycle-management: start-only
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

management:
  endpoint:
    health:
      # Show db/diskSpace/... in /actuator/health locally. Kept off in the base config
      # so production doesn't reveal its internals to anonymous callers.
      show-components: always
